[project]
name = "slackware-pkgcheck"
version = "0.1.0"
description = "Verifies that the files recorded by each Slackware package exist on the system."
readme = "README.md"
requires-python = ">=3.12"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "José Maldonado \"YukiteruAmano\"" }]
keywords = ["slackware", "packages", "integrity", "files", "verification", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: BSD License",
    "Operating System :: POSIX :: Linux",
    "Environment :: Console",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
dependencies = ["rich>=15.0.0,<16"]

[project.urls]
Repository = "https://github.com/yukiteruamano/slackware-pkgcheck"
Homepage = "https://github.com/yukiteruamano/slackware-pkgcheck"

[project.scripts]
pkgcheck = "pkgcheck.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pkgcheck"]

[tool.uv]
package = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RET", "ARG", "RUF"]
