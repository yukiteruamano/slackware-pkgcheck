[project]
name = "slackware-pkgcheck"
version = "1.0.1"
description = "Verifies that the files recorded by each Slackware package exist on the system."
readme = "README.md"
requires-python = ">=3.12"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "José Maldonado \"YukiteruAmano\"" }]
keywords = ["slackware", "packages", "integrity", "files", "verification", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: BSD License",
    "Operating System :: POSIX :: Linux",
    "Environment :: Console",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
dependencies = [
    "rich>=15.0.0,<16",
]

[project.urls]
Repository = "https://github.com/yukiteruamano/slackware-pkgcheck"
Homepage = "https://github.com/yukiteruamano/slackware-pkgcheck"

[project.scripts]
pkgcheck = "pkgcheck.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.18.0",
    "coverage>=7.6,<9",
    "pip-audit>=2.9.0",
    "ruff>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pkgcheck"]

[tool.uv]
package = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RET", "ARG", "RUF", "S", "ANN", "PTH", "T20", "D"]
ignore = ["S603", "S607", "S101", "ANN401", "D100", "D104", "D105", "D107", "D205", "D301", "D400", "D401", "E501", "D101"]
fixable = ["ALL"]
unfixable = ["S603", "S607"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S103", "S108", "S110", "S603", "S607", "ANN", "D", "PTH", "T20", "E501", "SIM", "F841", "C408"]
"src/pkgcheck/verifier.py" = ["PTH116", "SIM105"]
"src/pkgcheck/cli.py" = ["S603", "S606", "S607"]
"src/pkgcheck/scanner.py" = ["SIM110"]
"src/pkgcheck/reporter.py" = ["PTH105", "PTH108", "SIM105"]
"src/pkgcheck/libdeps.py" = ["PTH123"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
ignore_missing_imports = true
exclude = ["\\.venv", "build", "dist"]

[[tool.mypy.overrides]]
module = "rich.*"
ignore_missing_imports = true

[tool.coverage.run]
source = ["pkgcheck"]
branch = true
omit = ["tests/*", "*/__pycache__/*", "src/pkgcheck/__main__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == '__main__':",
]
fail_under = 85
show_missing = true
skip_covered = false

[tool.coverage.html]
directory = "htmlcov"
